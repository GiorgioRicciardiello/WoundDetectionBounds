input_excel: "C:\\Users\\riccig01\\OneDrive\\Projects\\MtSinai\\Vascbrain\\WoundDetectionBounds\\experiments.xlsx"

columns:
  # Infrastructure
  image_path: "image_path"
  time_min: "time_min"

  # Trajectory identifiers (define temporal sequences)
  condition: "sample_condition"         # DMSO, alk5i, media, candesartan
  experiment: "experiment"              # EXP1, EXP2
  sample_name: "sample_name"

  # Analysis factors (configurable for stratification/interaction)
  factors:
    - name: "cell_line"
      column: "cell_line"
    - name: "concentration"
      column: "concentration_mm"

segmentation:
  n_workers: 2
  save_debug_images: false
  process_missing: true
  use_kalman: true

analysis:
  control_condition: "dmso"

  # Option B: Stratify by cell_line and concentration
  stratify_by: ["cell_line", "concentration"]

  # Option C: Also include concentration as interaction term
  interaction_factors: ["concentration"]

  effect_size_metric: "cohens_d"
  output_formats: ["excel", "json"]
  alpha: 0.05

output:
  base_dir: "C:\\Users\\riccig01\\Documents\\vascbrain\\WoundImages\\WoundQuantification\\results_06122026"
  segmentation_subdir: "segmentation"
  analysis_subdir: "analysis"

  # Optional: Override specific paths for different disks
  # Example: Store trajectories on fast SSD, analysis on slow NAS
  # trajectories_pickle_path: "D:/fast_disk/trajectories.pickle"
  # measurements_xlsx_path: "D:/fast_disk/measurements.xlsx"
  # analysis_results_xlsx_path: "E:/slow_disk/analysis_results.xlsx"
  # analysis_results_json_path: "E:/slow_disk/analysis_results.json"

overwrite_existing: false
save_config_with_results: true
verbose: true
